project:
  name: clubhouse

analyzers:
  - profile: go-otel
    paths:
      - backend/
    roles:
      handler:
        directories:
          - backend/internal/handlers/
        type_suffix: Handler
      service:
        directories:
          - backend/internal/services/
        type_suffix: Service
        type_names: [AuthFailureTracker]
      external_call:
        directories:
          - backend/internal/services/links/
    call_graph:
      transitive_credit:
        - function: handlers.writeError
          provides: log
        - function: handlers.writeErrorWithMFARequired
          provides: log
        - function: services.fetchLinkMetadata
          provides: metric_error
        - function: services.NotificationService.sendPush*
          provides: metric_error
        - function: services.MetadataWorker.publishLinkMetadataUpdated
          provides: metric_error
        - function: observability.RecordLinkMetadataFetchDuration
          provides: metric_latency
        - function: services.WatchLogService.logWatch
          provides: trace
        - function: services.recordSpanError
          provides: metric_error
        - function: observability.RecordServiceError
          provides: metric_error
        - function: services.CookLogService.logCookAudit
          provides: audit
        - function: services.SavedRecipeService.logSavedRecipeAudit
          provides: audit
        - function: services.ReactionService.logReactionAudit
          provides: audit
        - function: services.HighlightReactionService.logHighlightReactionAudit
          provides: audit
        - function: services.BookshelfService.logBookshelfAudit
          provides: audit
        - function: services.PodcastSaveService.logPodcastSaveAudit
          provides: audit
        - function: services.ReadLogService.logReadAudit
          provides: audit
        - function: services.WatchLogService.logWatchAudit
          provides: audit
        - function: services.WatchlistService.logWatchlistAudit
          provides: audit

      io_sink_functions:
        - links.Fetcher.doRequestWithRetry   # add your wrapper sink methods here
      entry_points:
        route_files:
          - backend/cmd/server/main.go
          - backend/cmd/server/routes.go
    flows:
      exclude_paths:
        - "**/observability/**"   # exclude infra from flow gaps
        - "**/services/tracing*"
      middleware_provides:
        - trace                   # credit handler coverage from middleware

  - profile: typescript-otel
    paths:
      - frontend/src/
    roles:
      external_call:
        directories:
          - frontend/src/services/
        type_suffix: Client
      utility:
        directories:
          - frontend/src/
    call_graph:
      transitive_credit:
        - function: api.ApiClient.request
          provides: trace
        - function: api.ApiClient.request
          provides: metric_latency
        - function: api.ApiClient.uploadWithRetry
          provides: trace
        - function: api.ApiClient.uploadWithRetry
          provides: metric_latency
        - function: api.recordCsrfPrefetchTiming
          provides: metric_latency
    signals:
      trace:
        - pattern: call_method
          method: startSpan

rules:
  - id: handler-logging
    severity: error
    applies_to: [handler]
    requires: [log]
    message: Handler must have logging coverage
    fix: Add observability.LogError() or route errors through writeError()

  - id: service-trace-span
    severity: error
    applies_to: [service]
    exclude_unexported: true
    requires: [trace]
    message: Service methods must create trace spans
    fix: Add otel.Tracer(...).Start(ctx, ...), then defer span.End().

  - id: external-call-trace-span
    severity: warning
    applies_to: [external_call]
    exclude_prefixes: [parse, normalize, validate, is, should, clear]
    exclude_suffixes: [ForTests, ForTest]
    requires: [trace]
    message: External calls should be wrapped in a trace span
    fix: Start a span in this method before the outbound request.

  - id: external-call-latency-histogram
    severity: warning
    applies_to: [external_call]
    exclude_prefixes: [parse, normalize, validate, is, should, clear]
    exclude_suffixes: [ForTests, ForTest]
    requires: [metric_latency]
    message: External calls should emit latency histogram metrics
    fix: Add direct latency metric recording or register transitive metric credit for auto-instrumented clients.

  - id: state-change-audit
    severity: warning
    applies_to: [service]
    exclude_unexported: true
    exclude_prefixes: [Get, List, Is, Verify, Resolve, Load, Lookup, Check, Find, Has, Can, Search, Login, Validate]
    exclude_suffixes: [Exists]
    exclude_paths:
      - "backend/internal/services/auth_event.go"
      - "backend/internal/services/auth_failure.go"
      - "backend/internal/services/csrf.go"
      - "backend/internal/services/notification.go"
      - "backend/internal/services/password_reset.go"
      - "backend/internal/services/push.go"
      - "backend/internal/services/session.go"
    requires: [audit]
    message: State-changing service methods must emit audit signals
    fix: Add an audit log write for this state transition.

  - id: state-change-metric
    severity: info
    applies_to: [service]
    requires: [metric]
    exclude_unexported: true
    exclude_prefixes: [Get, List, Is, Verify, Resolve, Load, Lookup, Check, Find, Has, Can, populate, next, require]
    exclude_suffixes: [ForTests, ForTest, Audit, Exists]
    message: State-changing service methods should emit business activity metrics
    fix: Add observability.RecordBusinessEvent(...) or configure transitive_credit for shared metric emitters.

  - id: error-rate-counter
    severity: warning
    applies_to: [service, external_call]
    requires: [metric_error]
    exclude_prefixes: [Get, List, Is, Has, Can, Validate, Parse, Normalize, Build, New, scan, log, verify, resolve, load, persist, init, next]
    exclude_suffixes: [ForTests, ForTest]
    condition:
      name_matches: "^(Create|Update|Delete|Remove|Restore|Publish|Process|Deliver|Send|Fetch|Lookup|Sync|Log|Register|Reset|Refresh)"
      returns_error: true
    message: Service and external-call error paths should be countable via metric_error
    fix: Add metric_error instrumentation on each error return/branch, or route failures through a helper with transitive metric_error credit.

  - id: unstructured-logging
    severity: warning
    exclude_paths:                           # new: rule-level path exclusion
      - "**/observability/**"
      - "**/lib/observability/**"
    message: Unstructured logging call detected.

  - id: resource-saturation-gauge
    severity: warning
    exclude_paths:
      - "**/internal/testutil/**"
    message: Add instrumentation to measure resource saturation.

output:
  flow_error_max_depth: 0
  flow_warning_max_depth: 1
  flow_include_info: false
